image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-simple

variables:
    GIT_DEPTH: 0
    SERIES_BRANCH: '18.0'
    ODOO_ADMIN_PASS: admin
    CI_JOB_TOKEN_GIT_HOST: 'gitlab.crnd.pro'

    PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.hidden-pip-cache"

.only-stable-branch: &only_stable_branch
    only:
        - "18.0"

.only-dev-branch: &only_dev_branch
    only:
        - /^18.0-.*$/

.except-auto-commits: &except_auto_commits
    except:
        variables:
            - $CI_COMMIT_MESSAGE =~ /\[CI-AUTO-UPDATE\]/
            - $CI_COMMIT_MESSAGE =~ /Translated using Weblate/

# Disable global cache
cache: {}

.pip_cache: &pip_cache_definition
    cache:
        key: ${CI_JOB_NAME}
        paths:
            - "${PIP_CACHE_DIR}"

stages:
    - static-test
    - test
    - end2end
    - deploy

build_env:
    stage: static-test
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
    script:
        - pwd
        - whoami
        - python3 --version
        - odood --version
        - odood status
        - odood venv run -- flake8 --version
        - odood venv run -- pylint --version
        - echo "Checking branch compatability $CI_COMMIT_BRANCH" && [[ "$CI_COMMIT_BRANCH" =~ ^18.0(-.*)?$ ]]

flake8:
    stage: static-test
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
    script:
        - odood venv run -- flake8 --config=ci/flake8.cfg $(bash ci/list-addons.sh .)
    <<: *except_auto_commits

pylint:
    stage: static-test
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
    script:
        - odood venv run -- pylint --rcfile=ci/pylint_odoo.cfg --valid_odoo_versions=$SERIES_BRANCH -d manifest-required-author $(bash ci/list-addons.sh .)
    <<: *except_auto_commits

bandit:
    stage: static-test
    <<: *pip_cache_definition
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
        - odood venv pip -- install bandit
    script:
        - odood venv run -- bandit -r .
    <<: *except_auto_commits

check-versions:
    stage: static-test
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
        - git fetch origin $SERIES_BRANCH
    script:
        - odood repo check-versions .
    <<: *only_dev_branch
    <<: *except_auto_commits

ensure-changelog:
    stage: static-test
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
        - git fetch origin $SERIES_BRANCH
    script:
        - odood repo ensure-changelog . --start-ref origin/$SERIES_BRANCH --end-ref HEAD
    allow_failure: true
    <<: *only_dev_branch
    <<: *except_auto_commits

ensure-icons:
    stage: static-test
    script:
        - |
          res=0
          for addon in $(bash ci/list-addons.sh .); do
              if [ ! -f "$addon/static/description/icon.png" ]; then
                  echo "ERROR: addon $addon has no icon!"
                  res=1
              fi
          done
          exit $res
    allow_failure: true
    <<: *only_dev_branch
    <<: *except_auto_commits


tests:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: test
    timeout: 1h
    retry:
        max: 1
        when:
            - stuck_or_timeout_failure
            - runner_system_failure
    <<: *pip_cache_definition
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
        - sudo apt-get update && sudo apt-get install -y libmagic1
        - odood addons add --single-branch --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
        - odood --version
    script:
        - odood test -t --dir . --coverage --coverage-report --coverage-ignore-errors --coverage-skip-covered --coverage-fail-under 60
    <<: *except_auto_commits
    coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        when: on_failure
        expire_in: 1 day
        paths:
        - /tmp/odoo_tests/

test_installation_no_demo:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: test
    variables:
        ODOO_DB_NAME: test-db-clean
    <<: *pip_cache_definition
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
        - sudo apt-get update && sudo apt-get install -y libmagic1
        - odood addons add --single-branch --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
        - odood db create $ODOO_DB_NAME

    script:
        - odood addons install --db "$ODOO_DB_NAME" --dir-r .
    <<: *except_auto_commits

migration_tests:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: test
    timeout: 1h
    retry:
        max: 1
        when:
            - stuck_or_timeout_failure
            - runner_system_failure
    variables:
        ODOO_DB_NAME: test-db
    <<: *pip_cache_definition
    before_script:
        - "[ -e /etc/odood.yml ] || sudo ln -sf /opt/odoo/odood.yml /etc/odood.yml"
        - sudo apt-get update && sudo apt-get install -y libmagic1
        - odood addons add --single-branch --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
        - odood --version
    script:
        - odood test -t --migration --dir . --coverage --coverage-report --coverage-ignore-errors --coverage-skip-covered --coverage-fail-under 60
    coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
    <<: *only_dev_branch
    <<: *except_auto_commits
    allow_failure: true
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        when: on_failure
        expire_in: 1 day
        paths:
        - /tmp/odoo_tests/

test_playwright_e2e:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: end2end
    allow_failure: true
    variables:
        ODOO_BASE_URL: http://localhost:8069
        ODOO_DB: test-db-playwright
    <<: *pip_cache_definition
    before_script:
        - sudo apt-get update
        - sudo apt-get install -y libmagic1 curl ca-certificates
        - curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        - sudo apt-get install -y nodejs
        - odood addons add --single-branch --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
        - odood db create --recreate --demo --install-dir . $ODOO_DB
        - odood start -t 120
    script:
        - mkdir -p __tests__/playwright/test-results __tests__/playwright/playwright-report
        - cd __tests__/playwright
        - npm ci || npm install
        - npx playwright install --with-deps chromium
        - npx playwright test
    <<: *except_auto_commits
    artifacts:
        name: "$CI_JOB_NAME-$CI_COMMIT_REF_NAME"
        when: on_failure
        expire_in: 1 day
        paths:
            - __tests__/playwright/test-results/
            - __tests__/playwright/playwright-report/


update_addons_list_and_trans:
    image: registry.crnd.pro/crnd-opensource/docker/odoo-ci-x:18.0-ci
    stage: deploy
    before_script:
        - odood addons add --single-branch -r --odoo-requirements=odoo_requirements.txt
        - odood addons link -r .
    script:
        - odood addons list --installable --field name --field license --field version --field summary --field price --csv . > ./ADDONS.csv
        - odood addons list --installable --field name --field license --field version --field summary --field price --md . > ./ADDONS.md
        - odood tr regenerate --lang-file "uk_UA:uk" --lang-file "ru_RU:ru" --lang-file "de_DE:de" --lang-file "fr_FR:fr" --pot --pot-remove-dates --missing-only --pot-update --addon-dir .
        - git add ./ADDONS.csv ./ADDONS.md "*.po" "*.pot"
        - git -c "user.name=${GITLAB_USER_NAME}" -c "user.email=${GITLAB_USER_EMAIL}" commit -m "[CI-AUTO-UPDATE]"
        - echo "$CI_SSH_PRIVATE_KEY" > /tmp/push_key && chmod 600 /tmp/push_key
        - git remote set-url --push origin "git@${CI_JOB_TOKEN_GIT_HOST}:${CI_PROJECT_PATH}"
        - git -c core.sshCommand='ssh -T -o PasswordAuthentication=no -o StrictHostKeyChecking=no -i /tmp/push_key' push origin "HEAD:${CI_COMMIT_BRANCH}"
    <<: *only_stable_branch
    <<: *except_auto_commits
    allow_failure: true


.deploy_review_definition: &deploy_review_definition
    stage: deploy
    before_script:
        - ci-review-app init
    script:
        - ci-review-app start
    tags:
        - deploy
        - odoo-review-ci4-shared
        - review-apps


deploy_review_dev:
    <<: *deploy_review_definition
    environment:
        name: review/$CI_COMMIT_REF_NAME
        url: http://$CI_ENVIRONMENT_SLUG-$CI_PROJECT_ID.ci4.crnd.pro
        on_stop: stop_review_dev
        auto_stop_in: 1 week
    <<: *only_dev_branch
    when: manual

deploy_review_stable:
    <<: *deploy_review_definition
    environment:
        name: stable/$CI_COMMIT_REF_NAME
        url: http://$CI_ENVIRONMENT_SLUG-$CI_PROJECT_ID.ci4.crnd.pro
    <<: *only_stable_branch

stop_review_dev:
    stage: deploy
    environment:
        name: review/$CI_COMMIT_REF_NAME
        action: stop
    variables:
        GIT_STRATEGY: none
    script:
        - ci-review-app stop
    when: manual
    tags:
        - deploy
        - odoo-review-ci4-shared
        - review-apps
    <<: *only_dev_branch
